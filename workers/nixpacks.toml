# Railway Nixpacks build config — adds Chromium for the content-extract CDP path.
#
# The "..." spread is REQUIRED: Nixpacks auto-detects nodejs + pnpm + cacert
# from the Node provider. Without "...", this list REPLACES the defaults and
# strips packages needed for HTTPS/TLS during `pnpm install`, causing build
# failure with no clear message.
#
# Start command is set in workers/railway.json (deploy.startCommand) — do NOT
# duplicate here. Railway honors the JSON; a duplicate cmd causes silent
# overrides and bricked deploys.

[phases.setup]
nixPkgs = ["...", "chromium"]
