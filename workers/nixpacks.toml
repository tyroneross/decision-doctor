# Railway Nixpacks build config — installs Chromium for the content-extract CDP path.
#
# Why aptPkgs not nixPkgs for chromium:
# Nix's `chromium` package builds from source (10-20 min, often OOMs Railway's
# builder). Debian's apt `chromium` is a prebuilt binary that installs in
# seconds and lands at /usr/bin/chromium — which IBR's findChrome() already
# discovers (workers/src/cdp/browser.ts:22). The Puppeteer-Railway recipe
# (github.com/ryannono/Puppeteer-Railway-Buildpack) uses the same aptPkgs
# approach.
#
# "..." preserves Nixpacks' auto-detected packages (nodejs, pnpm, cacert).
# Start command is set in workers/railway.json — do not duplicate here.

[phases.setup]
aptPkgs = ["...", "chromium"]
